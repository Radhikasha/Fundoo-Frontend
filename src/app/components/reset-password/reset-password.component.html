<div class="page-wrapper">
  <div class="reset-card">
    <div class="lock-circle">
      <svg viewBox="0 0 24 24" class="lock-icon">
        <path fill="#1a73e8" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/>
      </svg>
    </div>

    <h2 class="title">Reset Your Password</h2>
    <p class="subtitle">Enter your new password below.</p>

    <!-- Show error if no token -->
    <div *ngIf="errorMessage && !token" class="token-error">
      <p class="error">{{ errorMessage }}</p>
      <button type="button" class="btn-block btn-primary" (click)="goToForgotPassword()">Request New Reset Link</button>
      <button type="button" class="btn-block btn-secondary" (click)="goToLogin()">Back to Login</button>
    </div>

    <!-- Show form if token exists -->
    <form *ngIf="token" (ngSubmit)="onResetPassword()" #resetForm="ngForm">
      <div class="input-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="newPassword"
          placeholder="New Password*"
          [(ngModel)]="newPassword"
          required
          class="text-input"
        />
        <button
          type="button"
          class="toggle-icon"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          <ng-container *ngIf="!showPassword">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" fill="#374151"/>
            </svg>
          </ng-container>
          <ng-container *ngIf="showPassword">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M3 3l18 18" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10.6 10.6a3 3 0 0 0 4.2 4.2" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1 12s4-7 11-7c2.1 0 4 .5 5.6 1.4" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </ng-container>
        </button>
      </div>
      <p class="error" *ngIf="passwordError">{{ passwordError }}</p>

      <div class="input-group">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          name="confirmPassword"
          placeholder="Confirm Password*"
          [(ngModel)]="confirmPassword"
          required
          class="text-input"
        />
        <button
          type="button"
          class="toggle-icon"
          (click)="toggleConfirmPasswordVisibility()"
          [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'"
        >
          <ng-container *ngIf="!showConfirmPassword">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" fill="#374151"/>
            </svg>
          </ng-container>
          <ng-container *ngIf="showConfirmPassword">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M3 3l18 18" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10.6 10.6a3 3 0 0 0 4.2 4.2" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1 12s4-7 11-7c2.1 0 4 .5 5.6 1.4" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </ng-container>
        </button>
      </div>
      <p class="error" *ngIf="confirmError">{{ confirmError }}</p>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

      <button type="submit" class="btn-block btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>
      <button type="button" class="btn-block btn-secondary" (click)="goToLogin()">Back to Login</button>
    </form>
  </div>
</div>
